schema_version = "1.1"

[task]
name = "nanoeval/browser-runtime"
description = "Prepare the reusable headed Chromium microVM used by browser tooling."

[agent]
timeout_sec = 300.0

[verifier]
timeout_sec = 30.0

[environment]
docker_image = "alpine:3.22"
cpus = 2
memory_mb = 2048
storage_mb = 2048
gpus = 0
allow_internet = true
